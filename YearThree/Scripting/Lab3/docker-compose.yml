version: "3.9"

services:

  exchange-service:
    image: php:8.3-apache
    container_name: exchange-service
    ports:
      - "8080:80"
    volumes:
      - ./php/app:/var/www/html
    env_file:
      - ./php/.env
    restart: unless-stopped

  cron:
    container_name: cron
    image: cron-service